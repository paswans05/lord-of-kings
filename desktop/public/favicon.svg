<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0d45" />
      <stop offset="100%" stop-color="#0a0314" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <linearGradient id="purpleGem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Purple Gradient Circle Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="#c084fc" stroke-width="4" stroke-opacity="0.3" />

  <!-- Crown Base & Sigil -->
  <g filter="url(#purpleGlow)" transform="translate(256, 256) scale(0.9) translate(-256, -256)">
    <!-- Main Crown Body -->
    <path d="M 128 360 L 110 180 L 190 260 L 256 120 L 322 260 L 402 180 L 384 360 Z" fill="url(#goldGrad)" stroke="#fff2b2" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Crown Base Band -->
    <rect x="120" y="360" width="272" height="44" rx="10" fill="url(#goldGrad)" stroke="#ffe699" stroke-width="4" />
    
    <!-- Gemstones on Band -->
    <circle cx="160" cy="382" r="12" fill="url(#purpleGem)" />
    <polygon points="256,368 268,382 256,396 244,382" fill="url(#purpleGem)" />
    <circle cx="352" cy="382" r="12" fill="url(#purpleGem)" />

    <!-- Crown Spire Jewels -->
    <circle cx="110" cy="170" r="14" fill="url(#purpleGem)" stroke="#ffffff" stroke-width="3" />
    <polygon points="256,92 272,116 256,140 240,116" fill="url(#purpleGem)" stroke="#ffffff" stroke-width="3" />
    <circle cx="402" cy="170" r="14" fill="url(#purpleGem)" stroke="#ffffff" stroke-width="3" />

    <!-- Center Royal Chess King Cross -->
    <path d="M 248 180 H 264 V 200 H 284 V 216 H 264 V 240 H 248 V 216 H 228 V 200 H 248 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
